<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>jase intro</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fff; }
body { font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
#stage { position: absolute; inset: 0; overflow: hidden; background: #fff; }
/* 화면 단위(su) 1 = 영상 2.6px. UI는 앱 실제 크기(pt)로 그리고 zoom으로 키움 */
#ui { position: absolute; left: 0; top: 0; width: 738.46px; height: 415.38px; zoom: 2.6; transform-origin: 50% 50%; }
.w { position: absolute; left: 0; top: 0; will-change: transform; }

/* 노치 조각 (NotchView.swift): 검은 바탕, 왼쪽 귀 66pt에 아이콘 둘, 펼치면 아래로 50pt */
.nz { position: relative; }
.notch { position: relative; background: #000; overflow: hidden; color: #fff;
  box-shadow: 0 10px 28px rgba(0,0,0,.16), 0 2px 6px rgba(0,0,0,.1); }
.ear { position: absolute; left: 0; top: 0; width: 66px; height: 38px; padding-left: 6px; display: flex; align-items: center; gap: 10px; }
.ear svg { display: block; flex: none; }
.guide { position: absolute; left: 18px; right: 18px; top: 38px; height: 42px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; white-space: nowrap; }
.guide .t { font-size: 13px; font-weight: 600; }
.guide .d { font-size: 11px; font-weight: 500; color: rgba(255,255,255,.6); margin-top: 2px; }
.guide .long { font-size: 10.4px; font-weight: 600; }
.guide .bar { width: 100%; height: 4px; border-radius: 2px; background: rgba(255,255,255,.18); margin-top: 6px; overflow: hidden; }
.guide .bar i { display: block; height: 100%; border-radius: 2px; background: rgb(64,219,107); }
.guide .saved { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.lbl { position: absolute; left: -60px; right: -60px; top: 100%; margin-top: 10px; text-align: center; font-size: 9px; font-weight: 600; color: #8a8a8e; white-space: nowrap; }

/* 전체 화면 (첫 장면에서 노치로 다가가기 전): 노치 조각과 같은 배율(1.3)로 그린 1512pt 화면 */
#screen { position: absolute; left: 0; top: 0; width: 1966px; height: 1229px; transform-origin: 50% 0; border-radius: 26px;
  background: linear-gradient(180deg, #f4f5f7, #e6e8ec); box-shadow: 0 0 0 26px #111214, 0 60px 160px rgba(0,0,0,.25); overflow: hidden; }
#screen .mb { position: absolute; left: 0; right: 0; top: 0; height: 49px; background: rgba(255,255,255,.55); display: flex; justify-content: space-between; align-items: center; padding: 0 30px; font-size: 17px; font-weight: 600; color: rgba(0,0,0,.72); }
#screen .mb span { display: flex; gap: 26px; } #screen .mb i { font-style: normal; font-weight: 500; }
#screen .dock { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 12px; padding: 10px; border-radius: 26px; background: rgba(255,255,255,.6); box-shadow: 0 0 0 1px rgba(0,0,0,.06); }
#screen .dock i { width: 64px; height: 64px; border-radius: 15px; background: #cfd2d8; }
#screen .win { position: absolute; left: 330px; top: 250px; width: 1300px; height: 760px; border-radius: 16px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 30px 80px rgba(0,0,0,.12); }
#screen .win::before { content: ""; position: absolute; left: 22px; top: 22px; width: 16px; height: 16px; border-radius: 50%; background: #d5d7dc; box-shadow: 26px 0 #d5d7dc, 52px 0 #d5d7dc; }
/* 옆에서 본 사람 (앱에 없는 설명 그림) */
.who svg { display: block; width: 300px; height: 230px; overflow: visible; }

#sub { position: absolute; left: 0; right: 0; bottom: 46px; text-align: center; font-size: 38px; font-weight: 600; letter-spacing: -.4px; color: #1d1d1f; }
#words { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 30px; font-size: 104px; font-weight: 700; letter-spacing: -2.5px; color: #111; }
#words span { display: inline-block; }
#words .hl { color: #2fc45c; }
#brand { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 14px; }
#brand img { width: 210px; height: 210px; }
#brand h1 { font-size: 120px; font-weight: 800; letter-spacing: -3px; color: #111; }
</style>
</head>
<body>
<div id="stage">
  <div id="ui">
    <div id="screen"><div class="win"></div><div class="mb"><span><b>Finder</b><i>File</i><i>Edit</i><i>View</i><i>Go</i><i>Window</i><i>Help</i></span><span><i>Sat 9:41</i></span></div><div class="dock"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
    <div id="notches"></div>
    <div class="w" id="wSide"><div class="who"><svg id="side" viewBox="0 0 300 230"></svg></div></div>
    <div class="w" id="wFront"><div class="who"><svg id="front" viewBox="0 0 300 230"></svg></div></div>
  </div>
  <div id="sub"></div>
  <div id="words"><span>You focus.</span><span class="hl">It notices.</span></div>
  <div id="brand"><img src="../docs/icon.png"><h1>jase</h1></div>
</div>

<script>
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  lin: p => p, out: p => 1 - Math.pow(1 - p, 3),
  io: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  back: p => { const c = 1.7; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); },
};
const prog = (t, t0, d, e = 'out') => E[e](clamp((t - t0) / d));
const popIn = (t, t0, d = .55) => lerp(.55, 1, prog(t, t0, d, 'back'));
const vis = (t, t0, t1, din = .18, dout = .25) => clamp((t - t0) / din) * (1 - clamp((t - t1) / dout));
function setHTML(el, html) { if (el._h !== html) { el.innerHTML = html; el._h = html; } }
function place(el, x, y, s = 1, o = 1, r = 0) {
  el.style.opacity = o; el.style.visibility = o <= 0.001 ? 'hidden' : '';
  el.style.transform = `translate(${x}px,${y}px) translate(-50%,-50%) rotate(${r}deg) scale(${s})`;
}
const CX = 369.23, CY = 207.69;

/* ---------- 앱과 같은 그림 (NotchView.swift, docs/index.html) ---------- */
// 0(초록) → 0.55(노랑) → 1(빨강)
function color(value) {
  const green = [64, 219, 107], yellow = [255, 209, 56], red = [255, 69, 64];
  const [a, b, p] = value < 0.55 ? [green, yellow, value / 0.55] : [yellow, red, (value - 0.55) / 0.45];
  return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * p)).join(',')})`;
}
const GRAY = 'rgba(142,142,147,.7)';
// 자세 아이콘: tilt(도), drop(0~1), close(0~1)
function posture(tilt, drop, close) {
  const head = `translate(0 ${drop * 5.5}) rotate(${tilt * 1.3} 12 19) translate(12 16) scale(${1 + 0.3 * close}) translate(-12 -16)`;
  return `<path fill="currentColor" d="M2 24v-1a6 6 0 0 1 6-6h8a6 6 0 0 1 6 6v1z"/>
    <g transform="${head}"><circle cx="12" cy="10" r="6" fill="currentColor" stroke="#000" stroke-width="3" paint-order="stroke"/>
    <circle cx="10.4" cy="9.5" r="1" fill="#000"/><circle cx="13.6" cy="9.5" r="1" fill="#000"/></g>`;
}
const EYE = [`<path fill="currentColor" d="M1 7C4.5 1.2 17.5 1.2 21 7c-3.5 5.8-16.5 5.8-20 0z"/><circle cx="11" cy="7" r="3" fill="#000"/><circle cx="11" cy="7" r="1.2" fill="currentColor"/>`,
  `<g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 5q8 9 16 0"/><path d="M6.5 8.5l-1.6 2.8M11 10v3.2M15.5 8.5l1.6 2.8"/></g>`];

const NW = 250, EAR = 66, NH = 38;   // 노치 폭(조각으로 잘라 낸 값), 귀, 높이
const N = [0, 1, 2, 3, 4].map(i => {
  const w = document.createElement('div'); w.className = 'w';
  w.innerHTML = `<div class="nz"><div class="notch"><div class="ear"><svg class="po" width="24" height="24" viewBox="0 0 24 24"></svg><svg class="ey" width="22" height="14" viewBox="0 0 22 14"></svg></div><div class="guide"></div></div><div class="lbl"></div></div>`;
  $('notches').appendChild(w);
  const q = s => w.querySelector(s);
  return { w, nz: q('.nz'), notch: q('.notch'), po: q('.po'), ey: q('.ey'), guide: q('.guide'), lbl: q('.lbl') };
});
// 노치 하나를 그림. open 0~1 (안내가 펼쳐진 정도), plevel/dry 0~1 (색), active=false면 회색
function drawNotch(n, t, { zoom = 1.3, nw = NW, open = 0, tilt = 0, drop = 0, close = 0, dry = 0, shut = false, active = true, guide = '', label = '' }) {
  const flash = Math.floor(t / .4) % 2 === 0;
  const plevel = Math.max(close, drop, clamp((Math.abs(tilt) - 6) / 16));
  n.nz.style.zoom = zoom;
  n.notch.style.width = nw + EAR * (1 + open) + 'px';
  n.notch.style.height = NH + 50 * open + 'px';
  n.notch.style.borderRadius = `0 0 ${lerp(12, 18, open)}px ${lerp(12, 18, open)}px`;
  setHTML(n.po, posture(tilt, drop, close));
  n.po.style.color = active ? color(plevel) : GRAY;
  n.po.style.opacity = active && plevel >= 1 && !flash ? .15 : 1;
  setHTML(n.ey, EYE[shut ? 1 : 0]);
  n.ey.style.color = active ? color(dry) : GRAY;
  n.ey.style.opacity = active && dry >= 1 && !flash ? .15 : 1;
  setHTML(n.guide, guide); n.guide.style.opacity = clamp(open * 2 - 1);
  setHTML(n.lbl, label);
}
const BIG = { zoom: 1.9, nw: 150 };   // 지나가는 조각은 노치를 더 잘라 내고 아이콘을 키움
const blink = (t, at) => at.some(b => t >= b && t < b + .28);

/* ---------- 설명 그림: 의자에 앉아 노트북을 보는 사람 ---------- */
const rad = d => d * Math.PI / 180;
const FURN = `<g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M66 180L58 92M62 180h90M106 180v34M82 214h48" stroke="#d6d6db" stroke-width="7"/>
  <path d="M186 153h114M282 153v61" stroke="#d6d6db" stroke-width="6"/><path d="M205 147h54l16-50" stroke="#2c2c2e" stroke-width="4.5"/></g>`;
// 옆모습. lean(다가감 0~1), slouch(내려앉음 0~1)
function sideView(lean, slouch, col) {
  const hx = 100 + 16 * slouch, hy = 160, th = rad(26 * lean - 24 * slouch), len = 64 - 8 * slouch;
  const sx = hx + len * Math.sin(th), sy = hy - len * Math.cos(th);
  const a = th + rad(8 * lean + 50 * slouch), cx = sx + 27 * Math.sin(a), cy = sy - 27 * Math.cos(a);
  const f = v => v.toFixed(1);
  return FURN + `<circle cx="100" cy="69" r="18" fill="none" stroke="#c7c7cc" stroke-width="1.5" stroke-dasharray="4 4"/>
  <g fill="none" stroke="${col}" stroke-linecap="round" stroke-linejoin="round">
    <path d="M160 163V211h15" stroke-width="16"/><path d="M${f(hx)} ${hy}L160 163" stroke-width="24"/>
    <path d="M${f(hx)} ${hy}Q${f((hx + sx) / 2 - 14 * slouch)} ${f((hy + sy) / 2)} ${f(sx)} ${f(sy)}" stroke-width="32"/>
    <path d="M${f(sx)} ${f(sy + 8)}Q${f(sx + 22)} 150 214 143" stroke="#fff" stroke-width="17"/><path d="M${f(sx)} ${f(sy + 8)}Q${f(sx + 22)} 150 214 143" stroke-width="11"/></g>
  <circle cx="${f(cx)}" cy="${f(cy)}" r="18" fill="${col}" stroke="#fff" stroke-width="4" paint-order="stroke"/><circle cx="${f(cx + 9)}" cy="${f(cy - 2)}" r="2.3" fill="#000"/>`;
}
// 앞모습 (고개 기울임은 옆에서 안 보여서)
function frontView(tilt, col) {
  return `<circle cx="150" cy="94" r="34" fill="none" stroke="#c7c7cc" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M92 214v-38a42 42 0 0 1 42-42h32a42 42 0 0 1 42 42v38z" fill="${col}"/>
  <g transform="rotate(${tilt.toFixed(1)} 150 150)"><circle cx="150" cy="94" r="34" fill="${col}" stroke="#fff" stroke-width="5" paint-order="stroke"/><circle cx="139" cy="91" r="3.6" fill="#000"/><circle cx="161" cy="91" r="3.6" fill="#000"/></g>`;
}

/* ---------- 타임라인 (초) ---------- */
const DURATION = 26.5;
const T = {
  zoom: 0.9, zoomEnd: 2.5,                                   // 0) 전체 화면 → 노치로 다가감
  face: 2.9, good: 4.2, saved: 5.6, close: 6.9,             // 1) 기준 자세 재기
  slide: 8.4, step: 2.0, move: .7,                           // 2) 조각이 한 칸씩 지나감 (다가감·기울임·내려앉음·눈), 아래에 사람
  dry: 15.7, dryDur: 2.6, blink: 19.3, eyeOut: 20.4,         // 3) 눈
  words: 20.9, wordsOut: 23.3, brand: 23.7,
};
// 자막 [시작, 끝, 문장] — 내레이션을 입힐 때 채움
const SUBS = [];
const NOSUB = new URLSearchParams(location.search).has('nosub');

function frame(t) {
  $('ui').style.transform = `scale(${1 + .035 * prog(t, 0, T.words, 'lin')})`;
  const sub = NOSUB ? null : SUBS.find(([a, b]) => t >= a && t < b);
  if ($('sub')._t !== (sub ? sub[2] : '')) { $('sub').textContent = $('sub')._t = sub ? sub[2] : ''; }

  /* 1) 처음 켜면 기준 자세를 잼 → 저장 → 접히고 초록 */
  const open = 1 - prog(t, T.close, .45, 'io');
  const pr = clamp((t - T.face) / (T.saved - T.face));
  let guide;
  if (t < T.face) guide = `<div class="t">Let's set your baseline</div><div class="d">Sit so the camera can see your face</div>`;
  else if (t < T.saved) guide = `<div class="long">${t < T.good ? 'Sit up straight and look at the screen from your usual distance' : 'Good. Hold still for a moment'}</div><div class="bar"><i style="width:${(Math.round(pr * 40) / 40 * 100).toFixed(1)}%"></i></div>`;
  else guide = `<div class="saved"><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="8" fill="rgb(64,219,107)"/><path d="M4.6 8.3l2.3 2.3 4.5-4.9" fill="none" stroke="#000" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>Saved your baseline posture</div>`;
  drawNotch(N[0], t, { open, guide, active: t >= T.saved, shut: blink(t, [T.close + .7]) });
  // 0) 전체 화면에서 노치로: 화면과 노치 조각을 같은 배율 k로 키움
  const K0 = 500 / 1966, zp = prog(t, T.zoom, T.zoomEnd - T.zoom, 'io'), k = lerp(K0, 1, zp);
  const top0 = lerp(CY - 150, CY - 36, zp);
  $('screen').style.transform = `translate(${CX - 983}px,${top0}px) scale(${k})`;
  $('screen').style.opacity = clamp(t / .3) * (1 - clamp((zp - .55) / .4));

  /* 2) 한 칸씩 지나가며 자세 셋을 보여 주고, 눈에서 멈춤 */
  const arrive = k => T.slide + (k - 1) * T.step + T.move;           // k번째 조각이 가운데에 서는 때
  let c = 0; for (let k = 0; k < 4; k++) c += prog(t, T.slide + k * T.step, T.move, 'io');
  const mv = k => prog(t, arrive(k) - .15, .9, 'io');
  const start = k => T.slide + (k - 1) * T.step;                     // k번째 조각으로 넘어가기 시작하는 때
  // 아래의 사람: 다가감 → (앞모습) 기울임 → 내려앉음. 다음으로 넘어갈 때 바른 자세로 돌아옴
  const back = k => 1 - prog(t, start(k + 1) - .1, .6, 'io');
  const lean = mv(1) * back(1), tiltA = 20 * mv(2) * back(2), slouch = mv(3) * back(3);
  setHTML($('side'), sideView(lean, slouch, color(Math.max(lean, slouch))));
  setHTML($('front'), frontView(tiltA, color(clamp((tiltA - 6) / 16))));
  const whoIn = T.close + .35, whoOut = start(4) + .1, fr = vis(t, start(2) + .15, start(3) + .15, .22, .22);
  const whoS = popIn(t, whoIn) * (1 - .12 * prog(t, whoOut, .3, 'lin')), whoO = vis(t, whoIn, whoOut, .2, .3);
  place($('wSide'), CX, CY + 64, whoS * lerp(1, .9, fr), whoO * (1 - fr));
  place($('wFront'), CX, CY + 64, whoS * lerp(.9, 1, fr), whoO * fr);
  drawNotch(N[1], t, { ...BIG, close: mv(1), label: 'Lean in', shut: blink(t, [arrive(1) + .1]) });
  drawNotch(N[2], t, { ...BIG, tilt: 20 * mv(2), label: 'Tilt your head', shut: blink(t, [arrive(2) + .9]) });
  drawNotch(N[3], t, { ...BIG, drop: mv(3), label: 'Slouch', shut: blink(t, [arrive(3) + .8]) });

  /* 3) 눈: 안 깜빡이면 빨개지다 점멸, 깜빡이면 초록 */
  const blinked = t >= T.blink;
  const dry = blinked ? 0 : clamp((t - T.dry) / T.dryDur);
  const secs = Math.min(10, Math.floor(dry * 10));
  drawNotch(N[4], t, { ...BIG, dry, shut: blink(t, [arrive(4) + .3, T.blink]),
    label: t < T.dry ? 'Blink' : blinked ? 'Blink — back to green' : `${secs}s since your last blink` });

  const leave = prog(t, T.eyeOut, .3, 'lin');
  const lift = 104 * prog(t, T.close + .15, .6, 'io') * (1 - prog(t, start(4), T.move, 'io'));   // 사람이 있는 동안 노치는 위로
  [0, 1, 2, 3, 4].forEach(i => {
    const d = i - c, near = 1 - Math.min(Math.abs(d), 1);
    let o, s = lerp(.8, 1, near);
    if (i === 0) o = 1;
    else if (i < 4) o = vis(t, T.slide + (i - 1) * T.step - .1, arrive(i + 1) + .1, .3, .3);
    else { o = vis(t, T.slide + 3 * T.step - .1, T.eyeOut, .3, .3); s *= 1 - .12 * leave; }
    const h = i === 0 ? (NH + 50 * open) * 1.3 * k : NH * 1.9;
    if (i === 0) { s *= k; o = clamp(t / .3) * (1 - clamp((t - arrive(1) - .1) / .3)); }
    place(N[i].w, CX + d * 470, (i === 0 ? top0 : CY - 36) - lift + h / 2, s, o);
  });

  /* 6) 문장 → 이름 */
  [...$('words').children].forEach((el, i) => {
    const t0 = T.words + i * .95, out = prog(t, T.wordsOut, .35, 'lin');
    el.style.opacity = clamp((t - t0) / .2) * (1 - out);
    el.style.transform = `translateY(${(1 - prog(t, t0, .6)) * 40 - out * 20}px) scale(${lerp(.9, 1, prog(t, t0, .6, 'back'))})`;
  });
  const [img, h1] = $('brand').children;
  img.style.opacity = clamp((t - T.brand) / .2);
  img.style.transform = `scale(${lerp(.3, 1, prog(t, T.brand, .8, 'back'))}) rotate(${lerp(-60, 0, prog(t, T.brand, .9))}deg)`;
  h1.style.opacity = clamp((t - T.brand - .45) / .3);
  h1.style.transform = `translateX(${(1 - prog(t, T.brand + .45, .6)) * -30}px)`;
}

window.frame = frame; window.DURATION = DURATION;
frame(0);
const q = new URLSearchParams(location.search);
if (q.has('t')) frame(+q.get('t'));
else if (!q.has('still')) { const s = performance.now(); (function loop() { frame(((performance.now() - s) / 1000) % DURATION); requestAnimationFrame(loop); })(); }
</script>
</body>
</html>
